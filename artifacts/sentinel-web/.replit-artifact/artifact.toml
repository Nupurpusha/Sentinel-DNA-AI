kind = "web"
previewPath = "/"
title = "SentinelDNA"
version = "1.0.0"
id = "artifacts/sentinel-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20692

[services.development]
run = "pnpm --filter @workspace/sentinel-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentinel-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/sentinel-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20692"
BASE_PATH = "/"
